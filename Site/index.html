<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WebSharper.D3 — strongly typed F# bindings for D3.js v7" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f59e0b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E" />
    <title>WebSharper.D3</title>
    <link rel="stylesheet" type="text/css" href="Content/Site.css" />
    <link rel="stylesheet" href="Style.css" />
</head>

<body>

    <header class="topbar">
        <a class="brand" href="https://github.com/dotnet-websharper/d3">
            <span class="brand-mark">D3</span>
            <span class="brand-text">
                <span class="brand-name">WebSharper.D3</span>
                <span class="brand-tag">Strongly typed D3 v7 bindings for F#</span>
            </span>
        </a>
        <nav class="topnav">
            <a href="https://github.com/dotnet-websharper/d3">Source</a>
            <a href="https://d3js.org">D3.js</a>
            <a href="https://websharper.com">WebSharper</a>
        </nav>
    </header>

    <main class="app">
        <div id="sample-navs" class="sample-navs"></div>

        <div class="layout">
            <section class="card viz">
                <div id="sample-main"></div>
            </section>

            <aside class="card about">
                <h2>About</h2>
                <div id="sample-side"></div>
            </aside>
        </div>
    </main>

    <!-- Sample descriptions, cloned into the sidebar by Site/Samples.fs. -->
    <div class="sample-data" hidden>
        <div id="Circles">
            <p>This intro sample joins a data set to SVG circle elements.</p>
        </div>
        <div id="WorldTour">
            <p>
                Another translation of an
                <a href="https://bl.ocks.org/mbostock/4183330">example</a> by mbostock.
            </p>
        </div>
    </div>

    <script type="text/javascript" src="topojson.v1.min.js"></script>
    <script type="text/javascript" src="Content/Site.bundle.js"></script>
</body>

</html>
